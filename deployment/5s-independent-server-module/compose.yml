services:
  five-s:
    image: ${FIVES_IMAGE:?FIVES_IMAGE is required}
    restart: unless-stopped
    read_only: true
    expose:
      - "8080"
    environment:
      FIVES_DB_PATH: /data/5s_crypto_v1.db
      FIVES_MODE: ${FIVES_MODE:-PAPER}
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_API_SECRET: ${BINANCE_DEMO_API_SECRET:-}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
    volumes:
      - ${FIVES_DATA_DIR:?FIVES_DATA_DIR is required}:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

networks:
  private:
    name: ${FIVES_NETWORK_NAME:-siftalpha-5s-private}
