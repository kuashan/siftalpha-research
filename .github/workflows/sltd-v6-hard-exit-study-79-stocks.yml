name: SLTD V6 Hard Exit Study 79 Stocks

on:
  push:
    branches:
      - research/sltd-v6-position-policy-v1
    paths:
      - ".github/workflows/sltd-v6-hard-exit-study-79-stocks.yml"
      - "research/ssss_reboot_v1/phase7/sltd_v6_hard_exit_study_79_stocks_v1.py"
      - "research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_PROTOCOL_v1.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hard-exit-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v6-position-policy-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "yfinance>=0.2.66,<0.3"

      - name: Run 79-stock hard-exit study
        run: |
          python research/ssss_reboot_v1/phase7/sltd_v6_hard_exit_study_79_stocks_v1.py

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -f research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.json
          test -f research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.md
          grep -q 'Status: \*\*COMPLETE\*\*' research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.md
          grep -q 'SLTD_V6_HARD_EXIT_STUDY_V1 = COMPLETE' research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.md

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.json
          git add research/ssss_reboot_v1/phase7/SLTD_V6_HARD_EXIT_STUDY_79_STOCKS_v1.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: complete 79-stock SLTD V6 hard-exit study"
          git push origin HEAD:research/sltd-v6-position-policy-v1
