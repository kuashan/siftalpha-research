name: E041 Discovery

on:
  push:
    paths:
      - "research/ssss/e041_loss_add_depth.py"
      - ".github/workflows/e041-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Run E041 Discovery
        run: python research/ssss/e041_loss_add_depth.py --json e041_result.json

      - name: Upload E041 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e041-result
          path: e041_result.json
          if-no-files-found: ignore
