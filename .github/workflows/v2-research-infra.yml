name: V2 Research Infra

on:
  push:
    branches:
      - research/source-xma-walkforward
    paths:
      - "research/ssss/source_xma/experiments/falsification_v2/**"
      - ".github/workflows/v2-research-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install deterministic test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas numpy

      - name: Run deterministic infrastructure and protocol-engine tests
        working-directory: research/ssss/source_xma/experiments/falsification_v2
        run: |
          set -euo pipefail
          python3 -m unittest -v test_v2_infrastructure.py test_v2_protocol_engine.py
