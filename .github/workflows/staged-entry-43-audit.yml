name: Staged Entry 43 Asset Audit

on:
  push:
    branches:
      - research/source-xma-walkforward
    paths:
      - "research/ssss/source_xma/experiments/staged_entry_crypto_study/build_43_asset_audit_v2.py"
      - ".github/workflows/staged-entry-43-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD

      - name: Generate frozen 43-asset audit outputs
        run: |
          set -euo pipefail
          python3 research/ssss/source_xma/experiments/staged_entry_crypto_study/build_43_asset_audit_v2.py

      - name: Verify branch did not drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: research/source-xma-walkforward
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger_sha=${SHA}"
          echo "remote_sha=${remote_sha}"
          test "${remote_sha}" = "${SHA}"

      - name: Commit computed research outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: research/source-xma-walkforward
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_INPUT_MANIFEST_v2.json
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/crypto_batch4_v2.json
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_ALL_CONFIGS_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_SUMMARY_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_TAIL_RISK_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_C_CONFIRMATION_EVENTS_43_ASSET_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_C_CONFIRMATION_ACCURACY_43_ASSET_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_BOOTSTRAP_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_SELECTIVE_SYNERGY_v2.csv
          git add research/ssss/source_xma/experiments/staged_entry_crypto_study/FIVEGZ5SE_STAGED_ENTRY_43_ASSET_COMPUTATION_AUDIT_v2.md
          git commit -m "research: compute staged-entry 43-asset audit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:"refs/heads/${BRANCH}"
