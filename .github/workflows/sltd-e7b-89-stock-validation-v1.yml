name: SLTD E7B 89 Stock Validation v1

on:
  push:
    branches:
      - research/sltd-e7-wick-exit-v1
    paths:
      - "research/ssss_reboot_v1/phase8/SLTD_E7B_WICK_EXIT_STRATEGY_v1.md"
      - "research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_PROTOCOL_v1.md"
      - "research/ssss_reboot_v1/phase8/sltd_e7b_89_stock_validation_v1.py"
      - ".github/workflows/sltd-e7b-89-stock-validation-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-e7-wick-exit-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas yfinance

      - name: Compile runner
        run: |
          python -m py_compile research/ssss_reboot_v1/phase8/sltd_e7b_89_stock_validation_v1.py

      - name: Verify frozen inputs
        run: |
          test -f research/ssss_reboot_v1/phase8/SLTD_E7B_WICK_EXIT_STRATEGY_v1.md
          test -f research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_PROTOCOL_v1.md
          test -f research/ssss_reboot_v1/phase8/SLTD_V7_79_STOCK_ROBUSTNESS_RESULT_v1.json
          python - <<'PY'
          from pathlib import Path
          batches={
            1:["AAPL","MSFT","NVDA","AMD","AVGO","ORCL","INTC","QCOM","MU","GOOGL"],
            2:["META","NFLX","AMZN","TSLA","HD","MCD","WMT","COST","PG","KO"],
            3:["PEP","ABT","LLY","UNH","JNJ","TMO","JPM","BAC","GS","V"],
            4:["MA","CAT","BA","GE","XOM","CVX","LIN","NEE","PLD"],
            5:["IBM","CSCO","CRM","ADBE","TXN","DIS","NKE","SBUX","TGT","LOW"],
            6:["MRK","PFE","ABBV","AMGN","GILD","C","MS","BLK","COP","UPS"],
            7:["ACN","NOW","INTU","AMAT","LRCX","BKNG","TJX","CMG","ROST","MAR"],
            8:["DHR","SYK","MDT","BMY","ISRG","SCHW","SPGI","DE","HON","RTX"],
          }
          oos=["WFC","LMT","PM","ADP","WM","UNP","SO","VZ","PANW","CVS"]
          symbols=[s for xs in batches.values() for s in xs]+oos
          assert len(symbols)==89 and len(set(symbols))==89
          root=Path(".")
          for b,xs in batches.items():
              for s in xs:
                  assert (root/f"research/ssss_reboot_v1/phase7/data_snapshot/batch_{b:02d}_stocks/{s}.csv.gz").exists()
                  assert (root/f"research/ssss_reboot_v1/phase7/signal_ledgers/BATCH_{b:02d}_{s}_FIRST_OBSERVED.csv.gz").exists()
          for s in oos:
              assert (root/f"research/ssss_reboot_v1/phase8/oos10_data_snapshot/{s}.csv.gz").exists()
              assert (root/f"research/ssss_reboot_v1/phase8/oos10_signal_ledgers/{s}_FIRST_OBSERVED.csv.gz").exists()
          print("E7B_UNIVERSE_89_PASS")
          PY

      - name: Run E7B validation
        run: |
          python research/ssss_reboot_v1/phase8/sltd_e7b_89_stock_validation_v1.py

      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          jp=Path("research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.json")
          mp=Path("research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.md")
          assert jp.exists() and mp.exists()
          x=json.loads(jp.read_text())
          assert x["meta"]["status"]=="COMPLETE"
          assert x["meta"]["universe_count"]==89
          assert x["meta"]["v7_79_parity"]=="PASS"
          assert len(x["per_symbol"])==89
          assert set(x["aggregates"])=={"5bps","10bps"}
          print("E7B_RESULT_VERIFY_PASS")
          PY

      - name: Commit result archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.json
          git add research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: archive E7B 89-stock validation result"
            git push origin HEAD:research/sltd-e7-wick-exit-v1
          fi

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-e7b-89-stock-validation-v1
          path: |
            research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.json
            research/ssss_reboot_v1/phase8/SLTD_E7B_89_STOCK_VALIDATION_RESULT_v1.md
          if-no-files-found: error
          retention-days: 30
