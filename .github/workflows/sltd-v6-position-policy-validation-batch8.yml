name: SLTD V6 Position Policy Validation Batch 8

on:
  push:
    branches:
      - research/sltd-v6-position-policy-v1
    paths:
      - ".github/workflows/sltd-v6-position-policy-validation-batch8.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v6-position-policy-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yfinance>=0.2.66,<0.3" "pandas>=2.2,<3" "numpy>=2,<3"

      - name: Run frozen-shortlist Validation Batch 8
        run: |
          python research/ssss_reboot_v1/phase7/sltd_v6_position_policy_validation_v1.py --batch 8 --force-fetch

      - name: Verify expected outputs
        run: |
          set -euo pipefail
          test -f research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.json
          test -f research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.md
          test -f research/ssss_reboot_v1/phase7/data_snapshot/batch_08_stocks/manifest.json
          grep -q 'Status: \*\*COMPLETE\*\*' research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.md
          grep -q 'Candidates evaluated: \*\*5 frozen candidates\*\*' research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.md

      - name: Commit frozen Validation Batch 8 outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss_reboot_v1/phase7/data_snapshot/batch_08_stocks
          git add research/ssss_reboot_v1/phase7/signal_ledgers/BATCH_08_*
          git add research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.json
          git add research/ssss_reboot_v1/phase7/batches/BATCH_08_STOCK_POSITION_POLICY_VALIDATION.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: complete SLTD V6 validation batch 8"
          git push origin HEAD:research/sltd-v6-position-policy-v1
