name: A-share 50 Data Audit v3

on:
  push:
    branches:
      - research/sltd-ashare50-integrated-risk-v1
    paths:
      - "research/ssss_reboot_v1/phase18/ashare50_data_audit_v3.py"
      - ".github/workflows/ashare50-data-audit-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q numpy pandas baostock
      - name: Run BaoStock audit
        run: python research/ssss_reboot_v1/phase18/ashare50_data_audit_v3.py
      - name: Verify audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase18")
          m=json.loads((root/"ashare50_data_snapshot_v3/manifest.json").read_text(encoding="utf-8"))
          assert m["status"]=="PASS", m["failures"]
          assert m["source"]=="BaoStock"
          assert m["adjustment"]=="qfq"
          assert m["symbol_count"]==50
          assert m["development_count"]==35
          assert m["fresh_count"]==15
          assert len(m["files"])==50
          assert all(v["formal_st_rows"]==0 for v in m["files"].values())
          print("A-SHARE AUDIT V3 PASS")
          PY
      - name: Commit snapshot v3
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase18/ashare50_data_snapshot_v3             research/ssss_reboot_v1/phase18/A_SHARE_50_DATA_AUDIT_V3.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BaoStock A-share 50 snapshot v3"
            git pull --rebase origin research/sltd-ashare50-integrated-risk-v1
            git push origin HEAD:research/sltd-ashare50-integrated-risk-v1
          fi
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashare50-data-audit-v3
          path: |
            research/ssss_reboot_v1/phase18/A_SHARE_50_DATA_AUDIT_V3.md
            research/ssss_reboot_v1/phase18/ashare50_data_snapshot_v3/manifest.json
          if-no-files-found: error
          retention-days: 30
