name: Pure SLTD State Score Exposure Map v1

on:
  push:
    branches:
      - research/sltd-state-score-exposure-map-v1
    paths:
      - "research/ssss_reboot_v1/phase12/PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_PROTOCOL_v1.md"
      - "research/ssss_reboot_v1/phase12/pure_sltd_state_score_exposure_map_v1.py"
      - ".github/workflows/pure-sltd-state-score-exposure-map-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q numpy pandas yfinance

      - name: Run state-score exposure map
        run: python research/ssss_reboot_v1/phase12/pure_sltd_state_score_exposure_map_v1.py

      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase12")
          j=root/"PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.json"
          m=root/"PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.md"
          manifest=root/"fresh24_state_score_exposure_data"/"manifest.json"
          assert j.is_file() and m.is_file() and manifest.is_file()
          x=json.loads(j.read_text(encoding="utf-8"))
          assert x["meta"]["chan_used"] is False
          assert x["meta"]["confirmed_state_count"] == 20
          assert len(x["meta"]["fresh_universe"]) == 24
          assert x["meta"]["prior_overlap"] == []
          assert x["decision"] in {
              "PROMOTE_TO_ENGINEERING_CANDIDATE",
              "RESEARCH_ONLY_NOT_PROMOTED",
              "REJECTED_NOT_ADMITTED",
          }
          assert len(list((root/"fresh24_state_score_exposure_data").glob("*.csv.gz"))) == 24
          print(json.dumps({
              "decision":x["decision"],
              "calibration":x["calibration"],
              "breadth":x["breadth_5bps"],
              "buckets":x["bucket_diagnostic"],
              "gates":x["gates"],
          }, indent=2))
          PY

      - name: Commit frozen Fresh24 data and result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase12/fresh24_state_score_exposure_data             research/ssss_reboot_v1/phase12/PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.json             research/ssss_reboot_v1/phase12/PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive SLTD state-score exposure-map v1"
            git push origin HEAD:research/sltd-state-score-exposure-map-v1
          fi

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-sltd-state-score-exposure-map-v1
          path: |
            research/ssss_reboot_v1/phase12/PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.json
            research/ssss_reboot_v1/phase12/PURE_SLTD_STATE_SCORE_EXPOSURE_MAP_RESULT_v1.md
            research/ssss_reboot_v1/phase12/fresh24_state_score_exposure_data/manifest.json
          if-no-files-found: error
          retention-days: 30
