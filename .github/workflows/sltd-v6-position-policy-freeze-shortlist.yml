name: SLTD V6 Position Policy Freeze Shortlist

on:
  push:
    branches:
      - research/sltd-v6-position-policy-v1
    paths:
      - "research/ssss_reboot_v1/phase7/freeze_sltd_v6_position_policy_shortlist_v1.py"
      - ".github/workflows/sltd-v6-position-policy-freeze-shortlist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v6-position-policy-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze unique discovery shortlist
        run: |
          python research/ssss_reboot_v1/phase7/freeze_sltd_v6_position_policy_shortlist_v1.py

      - name: Verify frozen outputs
        run: |
          set -euo pipefail
          test -f research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.json
          test -f research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.md
          grep -q 'Status: \*\*FROZEN BEFORE VALIDATION\*\*' research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.md
          grep -q 'PRIMARY' research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.md
          grep -q 'BACKUP_4' research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.md

      - name: Commit frozen shortlist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.json
          git add research/ssss_reboot_v1/phase7/SLTD_V6_POSITION_POLICY_DISCOVERY_FROZEN_SHORTLIST_v1.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: freeze SLTD V6 discovery shortlist"
          git push origin HEAD:research/sltd-v6-position-policy-v1
