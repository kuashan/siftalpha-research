name: 5s Crypto Multi-Strategy SSSS v1

on:
  push:
    branches:
      - feature/5s-crypto-multistrategy-ssss-v1
    paths:
      - "integrations/5s_crypto_binance_usdm_v1/**"
      - ".github/workflows/5s-crypto-multistrategy-ssss-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 5s-crypto-multistrategy-ssss-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/5s_crypto_binance_usdm_v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: integrations/5s_crypto_binance_usdm_v1/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and verify original SSSS ftindex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          expected = "25f8c56075c0021dd2d0567401d37def25d6a9b895f139b3a8a9abc376fecaa7"
          root = Path("strategy")
          raw = base64.b64decode((root / "SSSS.ftindex.b64").read_text(encoding="ascii"))
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, (actual, expected)
          (root / "SSSS.ftindex").write_bytes(raw)
          print("SSSS_FTINDEX_SHA256_PASS", actual)
          PY

      - name: Vendor HuntAlpha chart runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/lwc-pack vendor
          mkdir -p /tmp/lwc-pack vendor
          npm pack lightweight-charts@5.2.1 --pack-destination /tmp/lwc-pack >/tmp/lwc-pack/name.txt
          tgz="$(find /tmp/lwc-pack -maxdepth 1 -name 'lightweight-charts-*.tgz' | head -n1)"
          test -n "$tgz"
          mkdir -p /tmp/lwc-pack/unpacked
          tar -xzf "$tgz" -C /tmp/lwc-pack/unpacked
          cp /tmp/lwc-pack/unpacked/package/dist/lightweight-charts.standalone.production.js             vendor/lightweight-charts.standalone.production.js
          test -s vendor/lightweight-charts.standalone.production.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all
        run: python -m compileall -q .

      - name: Full legacy and SSSS regression
        run: python -m unittest discover -s tests -v

      - name: Frozen JS Python parity
        run: python -m unittest tests.test_m3_signal_engine_parity -v

      - name: SSSS strategy contract
        run: python -m unittest tests.test_multistrategy_ssss -v

      - name: UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          page = Path("templates/index.html").read_text(encoding="utf-8")
          registry = Path("strategy/registry.py").read_text(encoding="utf-8")
          source = Path("strategy/ssss_strategy.py").read_text(encoding="utf-8")
          assert 'action="/symbol-strategy"' in app
          assert 'STRATEGY_SSSS' in app
          assert 'STRATEGY_SSSS = "ssss"' in registry
          assert 'STRATEGY_E: StrategySpec' not in registry
          assert '💰=买入25%' in page
          assert '💥=全部清仓' in page
          assert 'strategy_indicator_markers' in app
          assert 'SSSS_SOURCE_SHA256' in source
          print("SSSS_SELECTOR_UI_PASS")
          PY

      - name: PAPER import
        env:
          FIVES_MODE: PAPER
          FIVES_DB_PATH: /tmp/5s_crypto_multistrategy_ssss.db
        run: |
          python - <<'PY'
          import app
          from strategy.registry import STRATEGY_5S, STRATEGY_SSSS, strategy_ids
          cfg = app.store.get_symbol_configs()
          assert tuple(app.settings.symbols) == ("BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT")
          assert all(x["strategy_id"] == STRATEGY_5S for x in cfg.values())
          assert strategy_ids() == (STRATEGY_5S, STRATEGY_SSSS)
          print("SSSS_APP_IMPORT_PASS")
          PY

      - name: Build flat direct-import package
        run: |
          set -euo pipefail
          out=/tmp/5s_crypto_multistrategy_ssss_v1
          rm -rf "$out"
          mkdir -p "$out"
          cp app.py charting.py config.py m2_testnet_check.py requirements.txt runtime_testnet_session.py storage.py "$out/"
          cp -R engine exchange strategy templates vendor "$out/"
          rm -f "$out/strategy/e_strategy.py" "$out/strategy/e_sltd_core.py"
          cd "$out"
          zip -qr /tmp/5s-crypto-multistrategy-ssss-v1.zip .

      - name: Verify package root and SSSS source
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          p="/tmp/5s-crypto-multistrategy-ssss-v1.zip"
          expected="25f8c56075c0021dd2d0567401d37def25d6a9b895f139b3a8a9abc376fecaa7"
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              required={
                  "app.py","requirements.txt","templates/index.html",
                  "strategy/frozen_signal_engine.py","strategy/registry.py",
                  "strategy/ssss_strategy.py","strategy/SSSS.ftindex",
                  "engine/execution.py","engine/recovery.py","engine/scheduler.py",
                  "vendor/lightweight-charts.standalone.production.js",
              }
              missing=sorted(required-names)
              assert not missing, missing
              assert "strategy/e_strategy.py" not in names
              assert "strategy/e_sltd_core.py" not in names
              assert hashlib.sha256(z.read("strategy/SSSS.ftindex")).hexdigest() == expected
              assert not any(x.startswith("5s-crypto-multistrategy-ssss-v1/") for x in names)
          print("SSSS_FLAT_DIRECT_IMPORT_PACKAGE_PASS")
          PY

      - name: Commit browser-download ZIP
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_dir="$GITHUB_WORKSPACE/releases/5s-crypto-multistrategy-ssss-v1"
          mkdir -p "$release_dir"
          cp /tmp/5s-crypto-multistrategy-ssss-v1.zip "$release_dir/5s-crypto-multistrategy-ssss-v1.zip"
          sha256sum /tmp/5s-crypto-multistrategy-ssss-v1.zip > "$release_dir/5s-crypto-multistrategy-ssss-v1.zip.sha256"
          git -C "$GITHUB_WORKSPACE" add releases/5s-crypto-multistrategy-ssss-v1
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "build: publish 5s SSSS multi-strategy ZIP"
            rm -f "$GITHUB_WORKSPACE/integrations/5s_crypto_binance_usdm_v1/strategy/SSSS.ftindex"
            git -C "$GITHUB_WORKSPACE" reset --hard HEAD
            git -C "$GITHUB_WORKSPACE" clean -fd integrations/5s_crypto_binance_usdm_v1/vendor
            git -C "$GITHUB_WORKSPACE" pull --rebase origin feature/5s-crypto-multistrategy-ssss-v1
            git -C "$GITHUB_WORKSPACE" push origin HEAD:feature/5s-crypto-multistrategy-ssss-v1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 5s-crypto-multistrategy-ssss-v1-direct-import
          path: /tmp/5s-crypto-multistrategy-ssss-v1.zip
          if-no-files-found: error
          retention-days: 30
