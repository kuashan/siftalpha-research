name: SLTD V7 SiftAlpha Web

on:
  push:
    branches:
      - feature/sltd-v7-siftalpha-zh-v7
    paths:
      - "integrations/sltd_v7_siftalpha_v1/**"
      - ".github/workflows/sltd-v7-siftalpha-web.yml"
      - "research/ssss_reboot_v1/phase7/data_snapshot/**"
      - "research/ssss_reboot_v1/phase7/signal_ledgers/**"
      - "research/ssss_reboot_v1/phase8/SLTD_V7_79_STOCK_ROBUSTNESS_RESULT_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/sltd-v7-siftalpha-zh-v7
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: |
          python -m compileall -q integrations/sltd_v7_siftalpha_v1

      - name: Run frozen-strategy regression tests
        run: |
          python -m unittest discover -s integrations/sltd_v7_siftalpha_v1/tests -v

      - name: Build SiftAlpha import ZIP
        run: |
          set -euo pipefail
          rm -rf /tmp/sltd_v7_package
          mkdir -p /tmp/sltd_v7_package
          cp -R integrations/sltd_v7_siftalpha_v1/. /tmp/sltd_v7_package/
          rm -rf /tmp/sltd_v7_package/tests
          rm -rf /tmp/sltd_v7_package/__pycache__
          find /tmp/sltd_v7_package -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/sltd_v7_package -type f -name '*.pyc' -delete
          cd /tmp/sltd_v7_package
          zip -r "$GITHUB_WORKSPACE/SLTD-V7-SiftAlpha-中文版-v7.zip" .

      - name: Verify package
        run: |
          set -euo pipefail
          unzip -l SLTD-V7-SiftAlpha-中文版-v7.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('SLTD-V7-SiftAlpha-中文版-v7.zip')
          names=set(z.namelist())
          required={'app.py','strategy.py','data_provider.py','requirements.txt','templates/index.html'}
          missing=required-names
          assert not missing, missing
          assert '.project.json' not in names
          assert 'README-STUDIO.txt' not in names
          app=z.read('app.py').decode('utf-8')
          assert 'ThreadingHTTPServer' in app
          assert 'SIFTALPHA_WEB_URL=' in app
          req=z.read('requirements.txt').decode('utf-8')
          assert '--only-binary=:all:' in req
          readme=z.read('README.md').decode('utf-8')
          strategy=z.read('strategy.py').decode('utf-8')
          page=z.read('templates/index.html').decode('utf-8')
          assert '蓝色持续21根以上：下轨触发买入' in strategy
          assert '绿色第11至20根：轻阻力触发卖出' in strategy
          assert 'SiftAlpha 中文版' in readme
          assert 'C2 强制清仓' in page
          print('PACKAGE_VERIFY_PASS')
          PY

      - name: Full process startup smoke
        run: |
          set -euo pipefail
          rm -f /tmp/sltd-v7-zh.log /tmp/sltd-v7-zh.pid
          (
            cd integrations/sltd_v7_siftalpha_v1
            python app.py > /tmp/sltd-v7-zh.log 2>&1 &
            echo $! > /tmp/sltd-v7-zh.pid
          )
          for i in $(seq 1 40); do
            if grep -q '^SIFTALPHA_WEB_URL=' /tmp/sltd-v7-zh.log; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/sltd-v7-zh.log
          url="$(sed -n 's/^SIFTALPHA_WEB_URL=//p' /tmp/sltd-v7-zh.log | tail -n 1)"
          test -n "$url"
          python - "$url" <<'PY'
          import json, sys, urllib.request
          url=sys.argv[1].rstrip('/')+'/api/health'
          with urllib.request.urlopen(url, timeout=5) as r:
              payload=json.load(r)
          assert payload['ok'] is True
          assert payload['active_rules'] == 12
          print('FULL_PROCESS_WEB_PASS', url)
          PY
          kill "$(cat /tmp/sltd-v7-zh.pid)" || true

      - name: Stage direct-import artifact
        run: |
          set -euo pipefail
          rm -rf direct-import
          mkdir direct-import
          cp -R /tmp/sltd_v7_package/. direct-import/
          test ! -e direct-import/.project.json
          test -f direct-import/app.py
          test -f direct-import/strategy.py
          test -f direct-import/data_provider.py
          test -f direct-import/templates/index.html

      - name: Upload direct SiftAlpha import artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-siftalpha-zh-v7
          path: direct-import/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
