name: 5s Independent Server Module ARM64

on:
  push:
    branches:
      - feature/5s-crypto-multistrategy-ssss-v1
    paths:
      - "integrations/5s_crypto_binance_usdm_v1/**"
      - "deployment/5s-independent-server-module/**"
      - ".github/workflows/5s-independent-server-module-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: 5s-independent-server-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: integrations/5s_crypto_binance_usdm_v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: integrations/5s_crypto_binance_usdm_v1/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and verify original SSSS ftindex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          expected = "25f8c56075c0021dd2d0567401d37def25d6a9b895f139b3a8a9abc376fecaa7"
          root = Path("strategy")
          raw = base64.b64decode((root / "SSSS.ftindex.b64").read_text(encoding="ascii"))
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, (actual, expected)
          (root / "SSSS.ftindex").write_bytes(raw)
          print("SSSS_FTINDEX_SHA256_PASS", actual)
          PY

      - name: Vendor HuntAlpha chart runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/lwc-pack vendor
          mkdir -p /tmp/lwc-pack vendor
          npm pack lightweight-charts@5.2.1 --pack-destination /tmp/lwc-pack >/tmp/lwc-pack/name.txt
          tgz="$(find /tmp/lwc-pack -maxdepth 1 -name 'lightweight-charts-*.tgz' | head -n1)"
          test -n "$tgz"
          mkdir -p /tmp/lwc-pack/unpacked
          tar -xzf "$tgz" -C /tmp/lwc-pack/unpacked
          cp /tmp/lwc-pack/unpacked/package/dist/lightweight-charts.standalone.production.js \
            vendor/lightweight-charts.standalone.production.js
          test -s vendor/lightweight-charts.standalone.production.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all
        run: python -m compileall -q .

      - name: Full legacy and SSSS regression
        run: python -m unittest discover -s tests -v

      - name: Frozen JS Python parity
        run: python -m unittest tests.test_m3_signal_engine_parity -v

      - name: SSSS strategy contract
        run: python -m unittest tests.test_multistrategy_ssss -v

      - name: UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          page = Path("templates/index.html").read_text(encoding="utf-8")
          registry = Path("strategy/registry.py").read_text(encoding="utf-8")
          source = Path("strategy/ssss_strategy.py").read_text(encoding="utf-8")
          assert 'action="/symbol-strategy"' in app
          assert 'STRATEGY_SSSS' in app
          assert 'STRATEGY_SSSS = "ssss"' in registry
          assert 'STRATEGY_E: StrategySpec' not in registry
          assert '💰=买入25%' in page
          assert '💥=全部清仓' in page
          assert 'strategy_indicator_markers' in app
          assert 'SSSS_SOURCE_SHA256' in source
          print("SSSS_SELECTOR_UI_PASS")
          PY

      - name: PAPER import
        env:
          FIVES_MODE: PAPER
          FIVES_DB_PATH: /tmp/5s_crypto_multistrategy_ssss.db
        run: |
          python - <<'PY'
          import app
          from strategy.registry import STRATEGY_5S, STRATEGY_SSSS, strategy_ids
          cfg = app.store.get_symbol_configs()
          assert tuple(app.settings.symbols) == ("BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT")
          assert all(x["strategy_id"] == STRATEGY_5S for x in cfg.values())
          assert strategy_ids() == (STRATEGY_5S, STRATEGY_SSSS)
          print("SSSS_APP_IMPORT_PASS")
          PY

      - name: M2 packaging contract
        run: python -m unittest tests.test_m2_container_contract -v

      - name: Compose interpolation and source boundary
        working-directory: .
        run: |
          set -euo pipefail
          FIVES_IMAGE=ghcr.io/example/5s@sha256=$(printf '0%.0s' {1..64}) \
          FIVES_DATA_DIR=/tmp/5s-data \
          docker compose -f deployment/5s-independent-server-module/compose.yml config >/tmp/5s-compose-config.yml
          grep -q 'target: /data' /tmp/5s-compose-config.yml
          ! grep -q '^    ports:' /tmp/5s-compose-config.yml
          python - <<'PY'
          from pathlib import Path
          tracked = set()
          for line in __import__("subprocess").check_output(["git", "ls-files"], text=True).splitlines():
              tracked.add(line)
          forbidden = {".env", "data/5s_crypto_v1.db", "trades.db"}
          assert not any(Path(path).name in forbidden for path in tracked)
          dockerfile = Path("deployment/5s-independent-server-module/Dockerfile").read_text(encoding="utf-8")
          assert "COPY integrations/5s_crypto_binance_usdm_v1/ /app/" not in dockerfile
          print("M2_SOURCE_BOUNDARY_PASS")
          PY

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Resolve immutable Python base image
        id: base
        working-directory: .
        run: |
          set -euo pipefail
          registry_token="$(curl -fsSL \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" \
            | python -c 'import json, sys; print(json.load(sys.stdin)["token"])')"
          digest="$(curl -fsSIL \
            -H "Authorization: Bearer $registry_token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/library/python/manifests/3.11-slim-bookworm" \
            | awk 'tolower($1) == "docker-content-digest:" {print $2; exit}' \
            | tr -d "\r")"
          unset registry_token
          test -n "$digest"
          case "$digest" in sha256:*) ;; *) echo "invalid base digest" >&2; exit 1 ;; esac
          echo "image=python:3.11-slim-bookworm@$digest" >> "$GITHUB_OUTPUT"
          echo "PYTHON_BASE_IMAGE=$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        working-directory: .
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ARM64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/5s-independent-server-module/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/5s-crypto-multistrategy-ssss-v1:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image digest
        working-directory: .
        run: |
          {
            echo "IMAGE=ghcr.io/${{ github.repository_owner }}/5s-crypto-multistrategy-ssss-v1:sha-${{ github.sha }}"
            echo "SOURCE_COMMIT=${{ github.sha }}"
            echo "IMAGE_DIGEST=${{ steps.image.outputs.digest }}"
            echo "PLATFORM=linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
