name: SLTD V7 Sell Intensity Full Exit Round1

on:
  push:
    branches:
      - research/sltd-v7-sell-intensity-full-exit-v1
    paths:
      - ".github/workflows/sltd-v7-sell-intensity-full-exit-round1.yml"
      - "research/ssss_reboot_v1/phase8/sltd_v7_sell_intensity_full_exit_round1_v1.py"
      - "research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_PROTOCOL_v1.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v7-sell-intensity-full-exit-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "yfinance>=0.2.66,<0.3"

      - name: Compile
        run: |
          python -m py_compile research/ssss_reboot_v1/phase8/sltd_v7_sell_intensity_full_exit_round1_v1.py

      - name: Run frozen Daily79 round1
        run: |
          set -euo pipefail
          python research/ssss_reboot_v1/phase8/sltd_v7_sell_intensity_full_exit_round1_v1.py

      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_ROUND1_RESULT_v1.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["meta"]["status"] == "IMPLEMENTED_AND_VERIFIED"
          assert x["baseline_reproduction"]["status"] == "PASS"
          assert len(x["summary"]) >= 20
          assert "DIRECT_C2_FULL" in x["summary"]
          print("SELL_INTENSITY_ROUND1_VERIFY_PASS")
          PY

      - name: Commit verified results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_ROUND1_RESULT_v1.json             research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_ROUND1_RESULT_v1.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: archive V7 sell intensity full-exit round1"
          git push origin HEAD:research/sltd-v7-sell-intensity-full-exit-v1

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-sell-intensity-full-exit-round1-v1
          path: |
            research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_ROUND1_RESULT_v1.json
            research/ssss_reboot_v1/phase8/SLTD_V7_SELL_INTENSITY_FULL_EXIT_ROUND1_RESULT_v1.md
          if-no-files-found: error
          retention-days: 30
