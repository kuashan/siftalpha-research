name: SLTD E A-share50 Validation v1

on:
  push:
    branches:
      - research/sltd-e-ashare50-v1
    paths:
      - "research/ssss_reboot_v1/phase19/SLTD_E_ASHARE50_VALIDATION_PROTOCOL_v1.md"
      - "research/ssss_reboot_v1/phase19/sltd_e_ashare50_validation_v1.py"
      - ".github/workflows/sltd-e-ashare50-validation-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q numpy pandas yfinance
      - name: Run E A-share50 validation
        run: python research/ssss_reboot_v1/phase19/sltd_e_ashare50_validation_v1.py
      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase19")
          j=root/"SLTD_E_ASHARE50_VALIDATION_RESULT_v1.json"
          m=root/"SLTD_E_ASHARE50_VALIDATION_RESULT_v1.md"
          assert j.is_file() and m.is_file()
          x=json.loads(j.read_text(encoding="utf-8"))
          assert x["meta"]["symbol_count"]==50
          assert x["meta"]["xma_causal"] is True
          assert x["meta"]["primary_timeframe"]=="1d"
          assert x["meta"]["higher_timeframe"]=="5d"
          assert x["meta"]["all_50_used"] is True
          assert x["status"]=="COMPLETE"
          print(json.dumps({
            "formal_start":x["meta"]["actual_common_formal_start"],
            "primary":x["results"]["primary"]["portfolio"],
            "breadth":x["results"]["primary"]["breadth_vs_buy_hold"],
            "rules":x["results"]["primary"]["rule_execution_totals"],
          },indent=2,ensure_ascii=False))
          PY
      - name: Commit E result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase19/SLTD_E_ASHARE50_VALIDATION_RESULT_v1.json             research/ssss_reboot_v1/phase19/SLTD_E_ASHARE50_VALIDATION_RESULT_v1.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive SLTD E A-share50 validation result"
            git pull --rebase origin research/sltd-e-ashare50-v1
            git push origin HEAD:research/sltd-e-ashare50-v1
          fi
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-e-ashare50-validation-v1
          path: |
            research/ssss_reboot_v1/phase19/SLTD_E_ASHARE50_VALIDATION_RESULT_v1.json
            research/ssss_reboot_v1/phase19/SLTD_E_ASHARE50_VALIDATION_RESULT_v1.md
          if-no-files-found: error
          retention-days: 30
