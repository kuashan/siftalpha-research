name: SLTD V7 Universal Sell Daily79

on:
  push:
    branches:
      - research/sltd-v7-universal-sell-daily79-v1
    paths:
      - "research/ssss_reboot_v1/phase8/sltd_v7_universal_sell_daily79_v1.py"
      - ".github/workflows/sltd-v7-universal-sell-daily79.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v7-universal-sell-daily79-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: |
          python -m compileall \
            integrations/sltd_v7_siftalpha_v1 \
            research/ssss_reboot_v1/phase8/sltd_v7_universal_sell_daily79_v1.py

      - name: Run daily79 validation
        run: |
          set -euo pipefail
          python research/ssss_reboot_v1/phase8/sltd_v7_universal_sell_daily79_v1.py

      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/ssss_reboot_v1/phase8/SLTD_V7_UNIVERSAL_SELL_DAILY79_RESULT_v1.json")
          x=json.loads(p.read_text())
          assert x["status"] == "IMPLEMENTED_AND_VERIFIED"
          assert x["scope"]["stocks"] == 79
          assert x["scope"]["timeframe"] == "1d"
          assert len(x["summary"]) == 8
          print("DAILY79_VERIFY_PASS")
          PY

      - name: Commit verified result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/ssss_reboot_v1/phase8/SLTD_V7_UNIVERSAL_SELL_DAILY79_RESULT_v1.json \
            research/ssss_reboot_v1/phase8/SLTD_V7_UNIVERSAL_SELL_DAILY79_RESULT_v1.md
          git commit -m "research: archive daily79 universal sell result v1"
          git push origin HEAD:research/sltd-v7-universal-sell-daily79-v1

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-universal-sell-daily79-v1
          path: |
            research/ssss_reboot_v1/phase8/SLTD_V7_UNIVERSAL_SELL_DAILY79_RESULT_v1.json
            research/ssss_reboot_v1/phase8/SLTD_V7_UNIVERSAL_SELL_DAILY79_RESULT_v1.md
          if-no-files-found: error
          retention-days: 30