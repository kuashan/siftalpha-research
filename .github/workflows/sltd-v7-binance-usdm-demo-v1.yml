name: SLTD V7 Binance USDM Demo v1

on:
  push:
    branches:
      - feature/sltd-v7-binance-usdm-demo-v1
    paths:
      - "integrations/sltd_v7_siftalpha_v1/**"
      - ".github/workflows/sltd-v7-binance-usdm-demo-v1.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: pip install -q binance-sdk-derivatives-trading-usds-futures==17.5.0
      - name: Compile V7 Binance modules
        working-directory: integrations/sltd_v7_siftalpha_v1
        run: |
          python -m py_compile             app.py data_provider.py             binance_demo_exchange.py binance_demo_session.py binance_demo_store.py             binance_demo_live_strategies.py binance_demo_executor.py binance_demo_controller.py             providers/binance_usdm.py
      - name: Run Binance Demo foundation tests
        working-directory: integrations/sltd_v7_siftalpha_v1
        run: python -m unittest tests.test_binance_demo_foundation -v
      - name: Run existing multi-strategy regression
        working-directory: integrations/sltd_v7_siftalpha_v1
        run: |
          python -m unittest             tests.test_regression             tests.test_5s_stocks_and_marketdata             tests.test_chan_strategy             tests.test_support_resistance_strategy -v
