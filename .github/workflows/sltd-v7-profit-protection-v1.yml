name: SLTD V7 Profit Protection Study v1

on:
  push:
    branches:
      - research/sltd-profit-protection-v1
    paths:
      - "research/ssss_reboot_v1/phase9/**"
      - ".github/workflows/sltd-v7-profit-protection-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-profit-protection-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas yfinance

      - name: Compile study
        run: |
          python -m py_compile research/ssss_reboot_v1/phase9/sltd_v7_profit_protection_v1.py

      - name: Run finite 89-stock study
        run: |
          python research/ssss_reboot_v1/phase9/sltd_v7_profit_protection_v1.py

      - name: Verify closure outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase9")
          js=root/"SLTD_V7_PROFIT_PROTECTION_RESULT_v1.json"
          md=root/"SLTD_V7_PROFIT_PROTECTION_RESULT_v1.md"
          assert js.exists() and md.exists()
          d=json.loads(js.read_text(encoding="utf-8"))
          assert d["meta"]["status"]=="COMPLETE"
          assert d["meta"]["v7_89_parity"]=="PASS"
          assert len(d["meta"]["variants"])==5
          assert set(d["classifications"])=={
              "P1_STRUCT_TREND_FAILURE",
              "P2_CHANDELIER_22_3_PROFIT",
              "P3_BS_SCALEOUT_25",
              "P4_BS25_PLUS_CHANDELIER",
          }
          assert set(x["classification"] for x in d["classifications"].values()) <= {
              "ADMIT_CANDIDATE","MIXED_NOT_ADMITTED","REJECTED_NOT_ADMITTED"
          }
          print("PROFIT_PROTECTION_CLOSURE_PASS")
          PY

      - name: Upload study results
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-profit-protection-v1-results
          path: |
            research/ssss_reboot_v1/phase9/SLTD_V7_PROFIT_PROTECTION_RESULT_v1.json
            research/ssss_reboot_v1/phase9/SLTD_V7_PROFIT_PROTECTION_RESULT_v1.md
          if-no-files-found: error
          retention-days: 30
