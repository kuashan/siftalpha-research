name: SLTD V7 Shunshi + Upstream Chan

on:
  push:
    branches:
      - feature/sltd-v7-support-resistance-tab-v1
    paths:
      - "integrations/shared_market_data/**"
      - "integrations/sltd_v7_siftalpha_v1/**"
      - ".github/workflows/sltd-v7-support-resistance-tab-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: integrations/sltd_v7_siftalpha_v1
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor pinned chan.py core
        run: |
          set -euo pipefail
          vendor="integrations/sltd_v7_siftalpha_v1/vendor/chanpy"
          rm -rf "$vendor"
          mkdir -p "$(dirname "$vendor")"
          git clone --quiet https://github.com/Vespa314/chan.py.git "$vendor"
          git -C "$vendor" checkout --quiet 429d6ed3043e27c93a003ba2b10e70a05575e1f5
          test "$(git -C "$vendor" rev-parse HEAD)" = "429d6ed3043e27c93a003ba2b10e70a05575e1f5"
          rm -rf "$vendor/.git"
          find "$vendor" -mindepth 1 -maxdepth 1 \
            ! -name Bi \
            ! -name BuySellPoint \
            ! -name ChanModel \
            ! -name Combiner \
            ! -name Common \
            ! -name DataAPI \
            ! -name KLine \
            ! -name Math \
            ! -name Seg \
            ! -name ZS \
            ! -name Chan.py \
            ! -name ChanConfig.py \
            ! -name LICENSE \
            ! -name __init__.py \
            -exec rm -rf {} +
          find "$vendor/DataAPI" -mindepth 1 -maxdepth 1 \
            ! -name CommonStockAPI.py \
            ! -name __init__.py \
            -exec rm -rf {} +
          printf '%s\n' 'Vespa314/chan.py' '429d6ed3043e27c93a003ba2b10e70a05575e1f5' > "$vendor/UPSTREAM_PIN.txt"
          echo "CHANPY_VENDOR_READY=$(find "$vendor" -type f | wc -l)"

      - name: Compile
        run: |
          python -m compileall -q integrations/shared_market_data
          python -m compileall -q integrations/sltd_v7_siftalpha_v1/vendor/chanpy
          python -m compileall -q integrations/sltd_v7_siftalpha_v1

      - name: Run regression tests
        run: python -m unittest discover -s integrations/sltd_v7_siftalpha_v1/tests -v

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("integrations/sltd_v7_siftalpha_v1/templates/index.html").read_text(encoding="utf-8")
          start=page.index("<script>")+len("<script>")
          end=page.rindex("</script>")
          Path("/tmp/sltd-index.js").write_text(page[start:end], encoding="utf-8")
          PY
          node --check /tmp/sltd-index.js

      - name: Health smoke
        run: |
          set -euo pipefail
          (
            cd integrations/sltd_v7_siftalpha_v1
            python app.py > /tmp/sltd-sr.log 2>&1 &
            echo $! > /tmp/sltd-sr.pid
          )
          for i in $(seq 1 40); do
            if grep -q '^SIFTALPHA_WEB_URL=' /tmp/sltd-sr.log; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/sltd-sr.log
          url="$(sed -n 's/^SIFTALPHA_WEB_URL=//p' /tmp/sltd-sr.log | tail -n 1)"
          test -n "$url"
          python - "$url" <<'PY'
          import json, sys, urllib.request
          url=sys.argv[1].rstrip('/')+'/api/health'
          with urllib.request.urlopen(url, timeout=5) as r:
              payload=json.load(r)
          assert payload["ok"] is True
          assert "support_resistance" in payload["available_strategies"]
          assert payload["support_resistance_active_rules"] == 0
          assert "chan.py" in payload["available_strategies"]["chan"]
          assert payload["chan_active_rules"] == 12
          print("SUPPORT_RESISTANCE_AND_CHANPY_HEALTH_PASS")
          PY
          kill "$(cat /tmp/sltd-sr.pid)" || true

      - name: Build SiftAlpha import ZIP
        run: |
          set -euo pipefail
          rm -rf /tmp/sltd_v7_sr_package direct-import
          mkdir -p /tmp/sltd_v7_sr_package direct-import
          cp -R integrations/sltd_v7_siftalpha_v1/. /tmp/sltd_v7_sr_package/
          cp -R integrations/shared_market_data /tmp/sltd_v7_sr_package/shared_market_data
          rm -rf /tmp/sltd_v7_sr_package/tests
          rm -rf /tmp/sltd_v7_sr_package/runtime_data
          find /tmp/sltd_v7_sr_package -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/sltd_v7_sr_package -type f -name '*.pyc' -delete
          cp -R /tmp/sltd_v7_sr_package/. direct-import/
          cd /tmp/sltd_v7_sr_package
          zip -r "$GITHUB_WORKSPACE/SLTD-V7-SiftAlpha-顺势-缠论-chanpy-v1.zip" .

      - name: Verify package
        run: |
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile("SLTD-V7-SiftAlpha-顺势-缠论-chanpy-v1.zip")
          names=set(z.namelist())
          required={
              "app.py",
              "strategy.py",
              "support_resistance_strategy.py",
              "chan_strategy.py",
              "vendor/chanpy/Chan.py",
              "vendor/chanpy/ChanConfig.py",
              "vendor/chanpy/LICENSE",
              "vendor/chanpy/UPSTREAM_PIN.txt",
              "data_provider.py",
              "templates/index.html",
              "shared_market_data/__init__.py",
              "vendor/chanpy/Chan.py",
              "vendor/chanpy/ChanConfig.py",
              "vendor/chanpy/LICENSE",
          }
          missing=required-names
          assert not missing, missing
          sr=z.read("support_resistance_strategy.py").decode("utf-8")
          page=z.read("templates/index.html").decode("utf-8")
          assert "SHORT_PERIOD = 3" in sr
          assert "LONG_PERIOD = 7" in sr
          assert 'data-strategy="support_resistance"' in page
          assert ">顺势<" in page
          assert "顺势 v1" in sr
          chan=z.read("chan_strategy.py").decode("utf-8")
          assert "429d6ed3043e27c93a003ba2b10e70a05575e1f5" in chan
          assert "Vespa314/chan.py" in chan
          assert "drawLine('sr_long_pressure','#52d49a',[],1)" in page
          assert "drawLine('sr_long_support','#ff7b82',[],1)" in page
          print("SHUNSHI_CHANPY_PACKAGE_PASS")
          PY

      - name: Packaged web smoke
        run: |
          set -euo pipefail
          rm -f /tmp/shunshi.log /tmp/shunshi.pid
          (
            cd /tmp/sltd_v7_sr_package
            python app.py > /tmp/shunshi.log 2>&1 &
            echo $! > /tmp/shunshi.pid
          )
          for i in $(seq 1 60); do
            if grep -q '^SIFTALPHA_WEB_URL=' /tmp/shunshi.log; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/shunshi.log
          url="$(sed -n 's/^SIFTALPHA_WEB_URL=//p' /tmp/shunshi.log | tail -n 1)"
          test -n "$url"
          python - "$url" <<'PY'
          import json, sys, urllib.request
          base=sys.argv[1].rstrip("/")
          with urllib.request.urlopen(base+"/api/health", timeout=5) as r:
              health=json.load(r)
          assert health["ok"] is True
          assert health["available_strategies"]["support_resistance"] == "顺势 v1"
          assert health["available_strategies"]["chan"] == "缠论 · chan.py upstream 429d6ed"
          print("PACKAGED_SHUNSHI_CHANPY_WEB_PASS", base)
          PY
          kill "$(cat /tmp/shunshi.pid)" || true

      - name: Upload direct SiftAlpha import artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-shunshi-chanpy-direct-import-v1
          path: direct-import/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sltd-v7-shunshi-chanpy-zip-v1
          path: SLTD-V7-SiftAlpha-顺势-缠论-chanpy-v1.zip
          if-no-files-found: error
          retention-days: 30
