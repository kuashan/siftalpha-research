name: E043 5m Paper Engine

on:
  push:
    paths:
      - "research/ssss/e043_5m_paper_engine.py"
      - ".github/workflows/e043-5m-paper.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: e043-5m-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Run E043 paper engine
        run: python research/ssss/e043_5m_paper_engine.py

      - name: Commit state and paper actions
        run: |
          if git diff --quiet -- research/ssss/live; then
            echo "No paper-state change."
            exit 0
          fi
          git config user.name "siftalpha-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/ssss/live/E043_STATE.json research/ssss/live/E043_5M_PAPER_TRADES.csv research/ssss/live/E043_5M_TRADING_JOURNAL.md
          git commit -m "paper: update E043 5m state"
          git pull --rebase origin main
          git push origin HEAD:main
