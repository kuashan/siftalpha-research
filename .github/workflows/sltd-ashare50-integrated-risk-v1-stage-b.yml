name: SLTD A-share50 Integrated Risk v1 Stage B

on:
  push:
    branches:
      - research/sltd-ashare50-integrated-risk-v1
    paths:
      - "research/ssss_reboot_v1/phase18/sltd_ashare50_integrated_risk_v1_stage_b.py"
      - "research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_AMENDMENT_D.md"
      - "research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_AMENDMENT_E.md"
      - ".github/workflows/sltd-ashare50-integrated-risk-v1-stage-b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -q numpy pandas yfinance
      - name: Run integrated holdout
        run: python research/ssss_reboot_v1/phase18/sltd_ashare50_integrated_risk_v1_stage_b.py
      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase18")
          j=root/"SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.json"
          m=root/"SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.md"
          assert j.is_file() and m.is_file()
          x=json.loads(j.read_text(encoding="utf-8"))
          assert x["meta"]["development_symbol_count"]==35
          assert x["meta"]["fresh_performance_read"] is False
          assert x["meta"]["fresh_oos_consumed"] is False
          assert x["meta"]["stable_negative_state_count"]==28
          assert x["decision"] in {"PROMOTED_TO_FRESH15","REJECTED_NOT_ADMITTED"}
          print(json.dumps({
            "decision":x["decision"],
            "primary_aggregate":x["primary"]["aggregate"],
            "primary_attribution":x["primary"]["attribution"],
            "gate_diagnostics":x["gate_diagnostics"],
            "gates":x["gates"],
          },indent=2,ensure_ascii=False))
          PY
      - name: Commit Stage B result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.json             research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive A-share integrated Stage B holdout"
            git pull --rebase origin research/sltd-ashare50-integrated-risk-v1
            git push origin HEAD:research/sltd-ashare50-integrated-risk-v1
          fi
      - name: Upload Stage B artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-ashare50-integrated-risk-v1-stage-b
          path: |
            research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.json
            research/ssss_reboot_v1/phase18/SLTD_ASHARE50_INTEGRATED_RISK_V1_STAGE_B_RESULT.md
          if-no-files-found: error
          retention-days: 30
