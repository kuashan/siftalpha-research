name: SLTD Relative Ranking v1 Stage B

on:
  push:
    branches:
      - research/sltd-score-level-relative-ranking-v1
    paths:
      - "research/ssss_reboot_v1/phase16/SLTD_RELATIVE_RANKING_V1_STAGE_B_AMENDMENT_A.md"
      - "research/ssss_reboot_v1/phase16/sltd_relative_ranking_v1_stage_b.py"
      - ".github/workflows/sltd-relative-ranking-v1-stage-b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q numpy pandas yfinance

      - name: Run Stage B
        run: python research/ssss_reboot_v1/phase16/sltd_relative_ranking_v1_stage_b.py

      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research/ssss_reboot_v1/phase16")
          j=root/"SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.json"
          m=root/"SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.md"
          assert j.is_file() and m.is_file()
          x=json.loads(j.read_text(encoding="utf-8"))
          assert x["meta"]["stable_state_count"] == 82
          assert x["meta"]["symbol_count"] == 79
          assert x["meta"]["development_only"] is True
          assert x["meta"]["chan_used"] is False
          assert x["meta"]["v7_used_as_signal"] is False
          assert x["meta"]["momentum_used"] is False
          assert x["meta"]["v4_probability_used"] is False
          assert x["meta"]["fresh_oos_consumed"] is False
          assert x["decision"] in {"PROMOTED_TO_FRESH_OOS","REJECTED_NOT_ADMITTED"}
          print(json.dumps({
              "decision":x["decision"],
              "annual":x["annual_comparison_5bps"],
              "gates":x["gates"],
              "five_bps":x["results"]["5bps"],
          }, indent=2))
          PY

      - name: Commit Stage B result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/ssss_reboot_v1/phase16/SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.json             research/ssss_reboot_v1/phase16/SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive SLTD relative-ranking v1 stage B"
            git push origin HEAD:research/sltd-score-level-relative-ranking-v1
          fi

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sltd-relative-ranking-v1-stage-b
          path: |
            research/ssss_reboot_v1/phase16/SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.json
            research/ssss_reboot_v1/phase16/SLTD_RELATIVE_RANKING_V1_STAGE_B_RESULT.md
          if-no-files-found: error
          retention-days: 30
