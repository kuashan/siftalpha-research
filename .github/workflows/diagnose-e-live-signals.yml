name: Diagnose E Live Signals

on:
  workflow_dispatch:
  push:
    branches:
      - feature/5s-crypto-multistrategy-e-v1
    paths:
      - ".github/workflows/diagnose-e-live-signals.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/5s_crypto_binance_usdm_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public Binance E signal diagnostic
        run: |
          python - <<'PY'
          from exchange.binance_usdm_public import BinanceUsdMPublicProbe
          from strategy.e_strategy import analyze_e

          probe = BinanceUsdMPublicProbe("https://fapi.binance.com", 10)
          symbols = ("BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT")
          timeframes = ("5m","15m","1h","4h")
          for symbol in symbols:
              for tf in timeframes:
                  rows = probe.klines(symbol, tf, limit=1000)
                  candles = [{
                      "date": str(r[0]),
                      "open_time": int(r[0]),
                      "open": float(r[1]),
                      "high": float(r[2]),
                      "low": float(r[3]),
                      "close": float(r[4]),
                      "volume": float(r[5]),
                  } for r in rows[:-1]]
                  try:
                      result = analyze_e(
                          symbol, candles, display_limit=300, timeframe=tf,
                          market_meta={"exchange_timezone":"UTC","continuous_24_7":True},
                      )
                      markers = result.get("markers") or []
                      events = result.get("events") or []
                      latest = result.get("latest_signal")
                      recent_cut = max(0, len(candles)-100)
                      recent_open_times = {int(x["open_time"]) for x in candles[recent_cut:]}
                      recent_markers = [m for m in markers if int(m.get("open_time", m.get("signal_open_time", -1))) in recent_open_times]
                      print("DIAG", symbol, tf,
                            "bars", len(candles),
                            "events", len(events),
                            "markers", len(markers),
                            "latest_signal", latest,
                            "recent100_markers", len(recent_markers))
                  except Exception as exc:
                      print("DIAG_ERROR", symbol, tf, type(exc).__name__, str(exc))
          PY
