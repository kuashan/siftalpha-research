name: SLTD V6 Position Policy Batch 9 Crypto Transfer

on:
  push:
    branches:
      - research/sltd-v6-position-policy-v1
    paths:
      - ".github/workflows/sltd-v6-position-policy-batch9-crypto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch9:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/sltd-v6-position-policy-v1
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ccxt>=4.4,<5" "pandas>=2.2,<3" "numpy>=2,<3" "yfinance>=0.2.66,<0.3"

      - name: Run Batch 9 crypto transfer check
        run: |
          python research/ssss_reboot_v1/phase7/sltd_v6_position_policy_crypto_transfer_v1.py

      - name: Verify expected outputs
        run: |
          set -euo pipefail
          test -f research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.json
          test -f research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.md
          test -f research/ssss_reboot_v1/phase7/data_snapshot/batch_09_crypto/manifest.json
          grep -q 'Status: \*\*COMPLETE\*\*' research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.md
          grep -q 'Mode: \*\*TRANSFER-ONLY / NO RETUNING\*\*' research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.md
          grep -q 'SLTD_V6_POSITION_POLICY_BATCH_09_CRYPTO_TRANSFER = COMPLETE' research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.md

      - name: Commit Batch 9 outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ssss_reboot_v1/phase7/data_snapshot/batch_09_crypto
          git add research/ssss_reboot_v1/phase7/signal_ledgers/BATCH_09_*
          git add research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.json
          git add research/ssss_reboot_v1/phase7/batches/BATCH_09_CRYPTO_POSITION_POLICY_TRANSFER.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "research: complete SLTD V6 crypto transfer batch 9"
          git push origin HEAD:research/sltd-v6-position-policy-v1
